  title: 알리바바와 40인의 도둑
  summary: 가난한 나무꾼 알리바바가 숲 속 비밀 동굴과 40인의 도둑을 알게 되면서 벌어지는 일들과, 욕심 많은 형 카심의 비극, 그리고
    영리한 하녀 모르지아나가 지혜와 재치로 도둑들을 물리쳐 알리바바의 집에 다시 평화를 되찾는 이야기이다.
