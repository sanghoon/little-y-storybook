- id: story_106
  title: 어부와 요정
  summary: 옛날 바닷가 마을에 가난한 어부 하산이 살았어요. 하산은 하루에 네 번만 그물을 던지기로 스스로 약속하고 바다로 나갔는데,
    마지막 그물에서 낡은 항아리 하나가 올라왔어요. 하산이 항아리의 인장을 떼고 뚜껑을 열자 연기가 솟아오르더니 오랫동안 갇혀 있던 요정이
    나타나, 사람을 미워하게 된 마음 때문에 하산을 해치겠다고 했어요. 하산은 겁이 났지만 재치 있게 말을 돌리며 이렇게 큰 요정이 정말
    작은 항아리 안에 들어갈 수 있는지 모르겠다고 놀리는 척을 했고, 요정은 자존심이 상해 스스로 연기가 되어 다시 항아리 안으로 들어가
    보였어요. 그 순간 하산은 얼른 뚜껑을 닫아 요정을 다시 가두었고, 둘은 항아리 안팎에서 서로가 얼마나 외롭고 두려웠는지 털어놓으며
    천천히 마음을 돌렸어요. 하산은 서로 거짓말을 하지 않고 약속을 지킨다면 자신도 요정을 돕겠다고 했고, 요정은 다시는 사람을 해치지
    않겠다고 굳게 약속했어요. 약속 뒤에 요정은 마법의 호수를 알려 주었고, 그곳에서 하산은 빨강, 파랑, 노랑, 초록 빛으로 반짝이는
    특별한 물고기를 잡았어요. 하산은 그 물고기를 왕궁에 가져가 왕에게 바쳤고, 왕은 처음 보는 신비한 물고기에 놀라 하산의 이야기를 끝까지
    들은 뒤 상을 내리고 앞으로도 돌봐 주겠다고 했어요. 그날 이후 하산의 집에는 따뜻한 음식과 필요한 것들이 조금씩 채워졌고, 바다
    어딘가에서는 자유를 되찾은 요정이 떠돌며, 하산은 다시 떠오르는 아침 바다를 바라보며 조용히 그물을 던졌어요.
