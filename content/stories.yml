  title: 크라바트
  summary: 가난한 고아 소년 크라바트가 신비한 꿈에 이끌려 외딴 습지의 검은 방앗간에 들어가 마법을 배우며 지내다가, 매년 한 제자가
    사라지는 어두운 비밀을 알게 되고, 사라진 친구 톤다의 흔적과 마을 소녀와의 약속을 힘삼아 방앗간 주인과 맞서 마지막 시험을 통해 저주를
    깨고 자유를 얻는 이야기입니다.
