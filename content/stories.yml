- id: story_103
  title: 이카로스
  summary: 대달로스는 누구보다 손재주가 뛰어난 장인이어서, 크레타 섬의 미노스 왕을 위해 사람을 빠뜨리기 위한 큰 미궁을 만들었어요.
    그러나 미노스 왕은 대달로스의 지혜를 두려워해, 아들 이카로스와 함께 섬에서 나가지 못하게 가두고 말았어요. 섬에 갇힌 두 사람은 절벽
    위에서 새들이 자유롭게 날아다니는 모습을 보며, 언젠가 저 새들처럼 하늘을 날아 이곳을 떠나고 싶다고 꿈꾸었지요. 대달로스는 바닷바람에
    날려 온 새의 깃털을 하나둘 모아 밀랍을 녹여 붙이며 커다란 날개를 만들었어요. 이카로스도 옆에서 깃털을 정리하고 도우며 두근거리는
    마음을 감추지 못했지요. 드디어 날개 두 쌍이 완성되자, 대달로스는 이카로스에게 너무 높이 날면 태양이 밀랍을 녹이고, 너무 낮게 날면
    바닷물이 날개를 적신다고 하며, 절대로 너무 높이도 낮게도 날지 않겠다고 약속해 달라고 꼭꼭 당부했어요. 아버지와 아들은 절벽 끝에서
    힘껏 도약해 하늘로 날아올랐어요. 섬과 바다가 아래로 작게 보이고, 시원한 바람이 얼굴을 스치자 이카로스는 커다란 기쁨을 느꼈지요.
    처음에는 아버지 곁을 잘 지키던 이카로스는 점점 더 높이 올라가 보고 싶은 마음을 참지 못하고, 구름 가까이까지 날아가 보려고 날개짓을
    크게 했어요. 그 순간 뜨거운 태양빛에 날개의 밀랍이 서서히 녹기 시작했고, 깃털이 하나둘 바다에 떨어져 내렸어요. 대달로스가 놀라
    이카로스에게 내려오라고 소리쳤지만, 이미 날개는 말을 듣지 않았어요. 이카로스의 몸은 점점 균형을 잃고, 마침내 바다 쪽으로 빠르게
    떨어져 깊은 곳으로 가라앉고 말았지요. 대달로스는 절벽 위와 하늘가에서 아들의 이름을 수없이 불렀지만, 바다는 조용하기만 했고 아무리
    불러도 대답이 돌아오지 않았어요. 시간이 지나 대달로스는 무거운 마음을 안은 채 혼자 배를 타고 섬을 떠나 다른 땅으로 향했어요. 넓은
    바다와 높은 하늘을 바라볼 때마다, 그는 날개를 달고 웃으며 날던 이카로스의 모습을 떠올렸지요. 그렇게 대달로스는 아들을 향한 사랑과
    그리움을 마음속 깊이 간직한 채, 조용히 새로운 길을 걸어 나가요.
