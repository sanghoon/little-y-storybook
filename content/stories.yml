- id: story_104
  title: 오르페우스와 에우리디케
  summary: 노래와 악기를 잘 다루는 오르페우스는 숲을 사랑하는 에우리디케와 깊이 사랑에 빠져 함께 행복한 날들을 보낸다. 그러나
    에우리디케가 숲에서 뱀에 물려 조용히 세상을 떠나자, 오르페우스는 슬픔 속에서 저승으로 내려가 하데스와 페르세포네 앞에서 간절한 노래를
    들려준다. 두 신은 그의 음악에 마음을 움직여 에우리디케를 데려가도 좋지만 지상에 나갈 때까지 절대로 뒤를 돌아보지 말라는 조건을
    내건다. 오르페우스는 어두운 길과 계단을 올라가며 뒤에서 따라오는 발소리를 느끼면서도 참고 걷지만, 거의 다 왔을 때 두려움과 그리움에
    결국 뒤돌아보고, 에우리디케는 안개처럼 저승으로 되돌아가 버린다. 땅 위에 홀로 남은 오르페우스는 세월이 흐를 때까지 숲과 별들 사이에서
    에우리디케를 떠올리며 노래하다가, 마침내 조용히 눈을 감고 세상을 떠난 뒤 저승의 강가에서 다시 에우리디케를 만나 함께 걸어간다고
    전해진다.
