- id: story_099
  title: 로미오와 줄리엣
  summary: 오래전부터 서로 미워하던 두 집안이 살고 있는 도시에서 로미오와 줄리엣은 가면무도회에서 처음 만나 마음이 끌립니다. 두 사람은
    달빛 아래에서 서로의 진심을 고백하고 비밀스럽게 사랑을 키우지만, 점점 심해지는 집안 싸움과 줄리엣에게 강요되는 약혼 때문에 갈라질
    위기에 놓입니다. 로미오가 도시를 떠나야 하게 되자, 로미오의 친구 벤은 둘을 돕기 위해 도시 사람들을 오래 돌봐 온 현명한 어른을
    찾아가 상담하고, 그 어른에게서 일정 시간이 지나면 스스로 깨어나는, 몸에 해가 없는 잠자는 약을 받아 줄리엣에게 전합니다. 줄리엣은
    깊이 잠들어 가족 묘소로 옮겨지고, 벤이 로미오에게 보낸 편지가 길에서 막혀 제때 전해지지 않아 무덤에서 큰 오해와 위험이 생깁니다.
    줄리엣이 정말 죽었다는 소문만 들은 로미오는 절망한 채 묘소로 가고, 그곳에서 차갑게 누워 있는 줄리엣을 보고 모든 것이 끝났다고
    생각하며 누구에게도 돌아가지 않고 이곳에 영원히 머물겠다고 마음먹지만, 마지막 순간 벤과 가족들이 도착해 약의 비밀과 진실을 알게
    됩니다. 줄리엣이 천천히 눈을 뜨는 모습을 본 두 집안은 그제야 싸움이 얼마나 많은 상처를 남겼는지 깨달아 화해를 결심합니다. 로미오와
    줄리엣은 한동안 떨어져 지내며 각자의 삶을 생각해 보기로 하지만, 서로를 잊지 않겠다고 조용히 약속하고, 그들의 이야기는 두 집안과 도시
    사람들의 마음을 천천히 바꾸어 가는 씨앗으로 남습니다.
