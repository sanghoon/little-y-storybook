- id: story_108
  title: 빌헬름 텔
  summary: 눈 덮인 산과 호수로 둘러싸인 알프스 산골 마을에 활을 잘 쏘는 아버지 빌헬름 텔과 아들 발터가 살고 있었어요. 어느 날 마을을
    거칠게 다스리는 총독 게슬러가 광장 한가운데에 자기 모자를 올려두고, 누구든 지나가면 절을 하라고 이상한 규칙을 만들어요. 텔과 발터는
    모자에 절을 하지 않았고, 화가 난 게슬러는 텔에게 발터 머리 위에 올린 사과를 화살로 맞혀 보라고 시켜요. 텔은 떨리는 마음으로 두
    개의 화살을 준비해 깊게 숨을 고르고, 마침내 한 번에 사과를 맞혀 갈라뜨려요. 하지만 두 번째 화살을 본 게슬러가 더 화를 내며 텔을
    묶어 호수 위 배에 태워 끌고 가요. 거센 폭풍 속에서 텔은 노를 저어 모두를 살리고, 바위 가까이에서 단숨에 뛰어내려 산길로 도망쳐요.
    텔은 좁은 산길에서 다시 지나가는 게슬러를 기다렸다가 마지막 화살을 쏘아, 게슬러가 다시는 사람들을 괴롭히지 못하게 해요. 사람들은
    조금씩 두려움에서 벗어나 서로를 도우며 마을을 다시 세우고, 발터는 아버지 곁에서 산길을 함께 걸으며 자라요. 산골에는 다시 조용한
    아침이 찾아와, 사람들은 더 깊은 숨을 쉴 수 있게 되었어요.
